# Human-owned (SPEC 11.2): the agent may not edit this file.
name: ci

on:
  pull_request:
  push:
    branches: [main, "agent/**"]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: make check
        run: make setup && make check
