{% extends "legacy_base.html" %}

{% block title %}Woodshed — New Routine{% endblock %}

{% block content %}
<h1>New Routine</h1>
<form method="post" action="/routines/new">
    <div class="field">
        <label for="name">Name</label>
        {% if errors and 'name' in errors %}
        <span class="error">{{ errors['name'] }}</span>
        {% endif %}
        <input type="text" name="name" id="name" placeholder="Routine name"
               value="{{ routine.name if routine else '' }}" required>
    </div>
    <button type="submit">Create</button>
</form>
{% endblock %}
