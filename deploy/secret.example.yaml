# Example only, NOT in the kustomization. In the cluster these come from OpenBao
# (secret/woodshed/*) via ExternalSecrets.
apiVersion: v1
kind: Secret
metadata:
  name: woodshed-app
  namespace: woodshed
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://woodshed:REPLACE_ME@woodshed-db:5432/woodshed
  APP_PASSWORD: REPLACE_ME
  SESSION_SECRET: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: woodshed-db
  namespace: woodshed
type: Opaque
stringData:
  POSTGRES_DB: woodshed
  POSTGRES_USER: woodshed
  POSTGRES_PASSWORD: REPLACE_ME
